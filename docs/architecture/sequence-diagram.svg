<svg width="1180" height="1060" viewBox="0 0 1180 1060" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="seqBg" x1="0" y1="0" x2="1180" y2="1060" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0E1320"/>
    </linearGradient>

    <marker id="sCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2DD4BF"/>
    </marker>
    <marker id="sSky" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38BDF8"/>
    </marker>
    <marker id="sRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
    <marker id="sAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F59E0B"/>
    </marker>
    <marker id="sMuted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1180" height="1060" rx="12" fill="url(#seqBg)"/>
  <rect x="1" y="1" width="1178" height="1058" rx="11" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Rootcause — Execution Sequence &amp; Error Recovery Paths</text>
  <text x="40" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Step-by-step trace covering happy path, Decider unavailability, action rejection, and Bedrock degradation.</text>

  <!-- Lifeline Headers -->
  <!-- Col 1: Browser/Frontend -->
  <g transform="translate(60, 95)">
    <rect width="130" height="38" rx="6" fill="#13232C" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Browser / UI</text>
  </g>
  <line x1="125" y1="133" x2="125" y2="1010" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Col 2: FastAPI -->
  <g transform="translate(240, 95)">
    <rect width="130" height="38" rx="6" fill="#162820" stroke="#10B981" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">FastAPI (/api)</text>
  </g>
  <line x1="305" y1="133" x2="305" y2="1010" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Col 3: Orchestrator -->
  <g transform="translate(420, 95)">
    <rect width="150" height="38" rx="6" fill="#17253D" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Orchestrator</text>
  </g>
  <line x1="495" y1="133" x2="495" y2="1010" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Col 4: Decider 2B -->
  <g transform="translate(620, 95)">
    <rect width="150" height="38" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
    <text x="75" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Decider 2B Service</text>
  </g>
  <line x1="695" y1="133" x2="695" y2="1010" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Col 5: Diagnostics -->
  <g transform="translate(820, 95)">
    <rect width="140" height="38" rx="6" fill="#132B2B" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Diagnostics Core</text>
  </g>
  <line x1="890" y1="133" x2="890" y2="1010" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Col 6: Bedrock -->
  <g transform="translate(1000, 95)">
    <rect width="140" height="38" rx="6" fill="#292215" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">AWS Bedrock</text>
  </g>
  <line x1="1070" y1="133" x2="1070" y2="1010" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Message 1: UI to API -->
  <line x1="125" y1="160" x2="297" y2="160" stroke="#2DD4BF" stroke-width="2" marker-end="url(#sCyan)"/>
  <text x="210" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2DD4BF">POST /api/investigations</text>

  <!-- Message 2: API to Orch -->
  <line x1="305" y1="185" x2="487" y2="185" stroke="#10B981" stroke-width="2" marker-end="url(#sCyan)"/>
  <text x="395" y="177" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#10B981">investigate(config, error)</text>

  <!-- LOOP BOX -->
  <rect x="440" y="210" width="510" height="280" rx="6" fill="#0E1624" stroke="#38BDF8" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="450" y="228" font-family="sans-serif" font-size="11" font-weight="700" fill="#38BDF8">LOOP: step 1..max_steps (Bounded Diagnostic Iteration)</text>

  <!-- Message 3: Orch to Decider -->
  <line x1="495" y1="250" x2="687" y2="250" stroke="#38BDF8" stroke-width="2" marker-end="url(#sSky)"/>
  <text x="595" y="242" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#38BDF8">choose_next_action(error, evidence, actions)</text>

  <!-- Message 4: Decider to Orch -->
  <line x1="695" y1="285" x2="503" y2="285" stroke="#818CF8" stroke-width="2" marker-end="url(#sSky)"/>
  <text x="595" y="277" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#818CF8">200 OK: {choice: "inspect_dependencies"}</text>

  <!-- Message 5: Orch validate self-call -->
  <rect x="480" y="305" width="130" height="24" rx="4" fill="#1E293B"/>
  <text x="545" y="321" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">_validate_decider() OK</text>

  <!-- Message 6: Orch to Diagnostics -->
  <line x1="495" y1="350" x2="882" y2="350" stroke="#2DD4BF" stroke-width="2" marker-end="url(#sCyan)"/>
  <text x="690" y="342" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#2DD4BF">execute_action("inspect_dependencies")</text>

  <!-- Message 7: Diagnostics to Orch -->
  <line x1="890" y1="385" x2="503" y2="385" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#sCyan)"/>
  <text x="690" y="377" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#2DD4BF">{status: "ok", found: {"requirements.txt": "..."}}</text>

  <!-- Message 8: Append to evidence -->
  <rect x="460" y="410" width="220" height="24" rx="4" fill="#1E293B"/>
  <text x="570" y="426" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">summarize_result() → append evidence</text>

  <!-- Subsequent cycle representation -->
  <line x1="495" y1="455" x2="687" y2="455" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sSky)"/>
  <line x1="695" y1="475" x2="503" y2="475" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sSky)"/>
  <text x="595" y="470" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">Next step: check_dependency or stop_and_report</text>

  <!-- ALT BLOCK 1: Decider Failure Recovery -->
  <rect x="440" y="510" width="480" height="95" rx="6" fill="#1A1115" stroke="#EF4444" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="450" y="528" font-family="sans-serif" font-size="11" font-weight="700" fill="#EF4444">ALT: Decider Offline / Unreachable / Timeout (Graceful Degradation)</text>

  <line x1="495" y1="550" x2="687" y2="550" stroke="#EF4444" stroke-width="2" marker-end="url(#sRed)"/>
  <text x="595" y="542" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#EF4444">Connection Refused (Port 8099)</text>

  <rect x="460" y="565" width="440" height="26" rx="4" fill="#2A1215"/>
  <text x="680" y="582" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#FCA5A5">Catch DeciderConnectionError → record decision_error → break loop safely</text>

  <!-- Step: Analysis Prompt & Secret Scrubbing -->
  <rect x="430" y="625" width="280" height="28" rx="4" fill="#1E293B"/>
  <text x="570" y="643" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#CBD5E1">_redact_secrets() &amp; _build_analysis_prompt()</text>

  <!-- Message 9: Orch to Bedrock -->
  <line x1="495" y1="675" x2="1062" y2="675" stroke="#F59E0B" stroke-width="2" marker-end="url(#sAmber)"/>
  <text x="780" y="667" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F59E0B">client.converse(modelId="amazon.nova-micro-v1:0", prompt)</text>

  <!-- Message 10: Bedrock to Orch -->
  <line x1="1070" y1="710" x2="503" y2="710" stroke="#F59E0B" stroke-width="2" marker-end="url(#sAmber)"/>
  <text x="780" y="702" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F59E0B">200 OK: Validated RootCauseReport JSON</text>

  <!-- ALT BLOCK 2: Bedrock Error Recovery -->
  <rect x="440" y="740" width="670" height="100" rx="6" fill="#1D1710" stroke="#F59E0B" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="450" y="758" font-family="sans-serif" font-size="11" font-weight="700" fill="#F59E0B">ALT: Bedrock API Error / Missing AWS Credentials / Invalid JSON</text>

  <line x1="1070" y1="785" x2="503" y2="785" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#sAmber)"/>
  <text x="780" y="777" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#FBBF24">ClientError / BotoCoreError / Malformed Output</text>

  <rect x="460" y="800" width="630" height="26" rx="4" fill="#292015"/>
  <text x="775" y="817" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#FBBF24">Honest fallback: analysis_status="bedrock_error", preserve diagnostic history without hallucination</text>

  <!-- Return to API -->
  <line x1="495" y1="870" x2="313" y2="870" stroke="#10B981" stroke-width="2" marker-end="url(#sCyan)"/>
  <text x="404" y="862" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#10B981">return investigation dict</text>

  <!-- Unwrap and validate response -->
  <rect x="230" y="895" width="150" height="24" rx="4" fill="#162820"/>
  <text x="305" y="911" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A7F3D0">_unwrap_analysis()</text>

  <!-- Return to Frontend -->
  <line x1="305" y1="940" x2="133" y2="940" stroke="#2DD4BF" stroke-width="2" marker-end="url(#sCyan)"/>
  <text x="219" y="932" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2DD4BF">HTTP 200: InvestigationResponse</text>

  <!-- Render on Frontend -->
  <rect x="40" y="965" width="170" height="34" rx="6" fill="#13232C" stroke="#2DD4BF" stroke-width="1"/>
  <text x="125" y="986" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Render Results &amp; Graph</text>
</svg>
